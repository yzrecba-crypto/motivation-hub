<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up | Motivation Hub</title>
    <meta name="description" content="Create a Membership account and start your daily motivation streak today." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-page="auth">
    <header class="topbar">
      <nav class="nav container">
        <a href="index.html" class="logo">
          <span class="logo-mark">🔥</span>
          <span>Motivation Hub</span>
        </a>

        <button class="menu-toggle" aria-label="Open navigation menu">☰</button>

        <div class="nav-links">
          <a href="index.html">Home</a>
          <a href="pricing.html">Membership</a>
          <a href="login.html" class="btn btn-ghost">Login</a>
        </div>
      </nav>
    </header>

    <main class="container auth-page">
      <div class="auth-card glass-panel">
        <span class="eyebrow">Join the movement</span>
        <h1>Create account</h1>

        <form id="signup-form" class="auth-form">
          <label>
            Full name
            <input type="text" name="name" placeholder="Your name" required />
          </label>

          <label>
            Email
            <input type="email" name="email" placeholder="you@example.com" required />
          </label>

          <label>
            Password
            <input type="password" name="password" placeholder="Create a password" required />
          </label>

          <label>
            Goal focus
            <select name="goal">
              <option value="discipline">Discipline</option>
              <option value="fitness">Fitness</option>
              <option value="business">Business</option>
              <option value="mindset">Mindset</option>
            </select>
          </label>

          <button class="btn btn-primary full-width" type="submit">Create account</button>
        </form>

        <div class="auth-switch">
          <span>Already have an account?</span>
          <a href="login.html">Login</a>
        </div>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
